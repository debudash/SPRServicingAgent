# Paid LLM evals (API credits). Manual only, by design: while the build stabilises, evals run by hand
# at milestones (end of M4 and before release), not on every PR. When the build is stable, a small
# smoke subset can be added to PRs. That switch is a human decision, recorded as an ADR.
#
# Placeholder until the `quality` lane builds the harness: it only checks the key is configured.

name: evals

on:
  workflow_dispatch:
    inputs:
      suite:
        description: "smoke (a few cases, cheap model) or full (all cases, repeats, model comparison)"
        required: true
        default: smoke
        type: choice
        options: [smoke, full]

permissions:
  contents: read

jobs:
  evals:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Check the API key is configured
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "::error::Set the ANTHROPIC_API_KEY secret first"; exit 1; fi
          echo "Eval harness not built yet (suite: ${{ inputs.suite }}). See evals/ and the M2 milestone."
